<title>Fúria de Ferro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Teko:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone war game. Compact war-chest HUD, dusk battlefield canvas, fury gauge, troop cards, power row, forge drawer. */
:root{
  color-scheme:dark;
  --bg:#120a12; --bg2:#1c1119; --card:#26161f; --card2:#33202a; --line:#46303a; --line2:#5e4048;
  --ink:#f6ece2; --mute:#bba39a; --dim:#7a645f;
  --blood:#d5302a; --blood-hi:#ff5c3e; --blood-lo:#7a1410; --ember:#ff9a2e;
  --gold:#ffcb4c; --gold-hi:#fff0b0; --gold-lo:#9a6812;
  --ice:#8cc0ff; --void:#a46cff; --ok:#86e59a;
  --fd:'Black Ops One','Impact','Arial Black',sans-serif;
  --fb:'Teko','Arial Narrow','Roboto Condensed',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:18px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px}
.stg{flex:1;min-width:0;line-height:1}
.stg small{display:block;font-size:15px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.stg b{font-family:var(--fd);font-weight:400;font-size:24px;letter-spacing:.02em}
.purse{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 8px;border-radius:20px;background:linear-gradient(180deg,#2c1a12,#1a0f0a);border:1px solid var(--gold-lo);font-family:var(--fd);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.coin{display:inline-block;flex:none;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 45%,var(--gold-lo));box-shadow:inset 0 0 0 2px rgba(80,40,0,.35)}
.mute{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.mute svg{width:20px;height:20px}

/* Campo */
.field{position:relative;flex:1 1 auto;min-height:230px;max-height:430px;border-radius:16px;overflow:hidden;background:#2a1020;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.45);touch-action:none}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(10,4,8,.55),rgba(10,4,8,.85));padding:16px;z-index:4}
.banner .in{text-align:center;max-width:340px;animation:slam .5s cubic-bezier(.2,1.7,.4,1)}
.banner h2{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.6)}
.banner.win h2{color:var(--gold)}
.banner.lose h2{color:var(--blood-hi)}
.banner p{margin:10px 0 0;font-size:21px;line-height:1.1;text-wrap:balance}
.banner .loot{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-size:30px;color:var(--gold);margin-top:8px}
.banner .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:11px 20px 8px;border-radius:12px;font-family:var(--fd);font-size:18px;letter-spacing:.02em;background:linear-gradient(180deg,var(--blood-hi),var(--blood));color:#fff;box-shadow:0 5px 0 var(--blood-lo),0 8px 20px rgba(213,48,42,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blood-lo)}
.btn.alt{background:linear-gradient(180deg,#4a2c18,#2e1a10);box-shadow:0 5px 0 #160b06;color:var(--gold)}

/* Fúria */
.fury{position:relative;flex:none;height:26px;border-radius:9px;background:#0b0609;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.fury i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--blood-lo),var(--blood) 55%,var(--ember));will-change:transform}
.fury .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.45) calc(10% - 2px) 10%)}
.fury span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:3px 12px 0;font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}

/* Tropas */
.troops{flex:0 1 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-height:112px;max-height:160px;height:22%}
.tr{position:relative;display:flex;flex-direction:column;align-items:stretch;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#3d2430,#1d1016 70%);box-shadow:inset 0 0 0 1px var(--line);transition:transform .06s}
.tr .fill{position:absolute;inset:0;transform-origin:bottom;transform:scaleY(0);background:linear-gradient(0deg,rgba(213,48,42,.32),rgba(213,48,42,.06));pointer-events:none;will-change:transform}
.tr canvas{position:relative;flex:1;min-height:0;width:100%;filter:grayscale(.75) brightness(.7);transition:filter .15s}
.tr .meta{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 2px 5px;line-height:1}
.tr .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tr .cs{display:inline-flex;align-items:center;gap:3px;margin-top:2px;padding:3px 8px 1px;border-radius:8px;background:rgba(0,0,0,.45);font-family:var(--fd);font-size:13px;color:var(--mute)}
.tr .cs svg{width:10px;height:12px}
.tr .lv{position:absolute;top:5px;left:6px;z-index:1;font-size:15px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.tr.ok{box-shadow:inset 0 0 0 2px var(--blood),0 0 18px rgba(213,48,42,.35)}
.tr.ok canvas{filter:none}
.tr.ok .cs{background:var(--blood);color:#fff}
.tr:active{transform:scale(.93)}
.tr.locked{pointer-events:none}
.tr.locked canvas{filter:grayscale(1) brightness(.25)}
.tr.locked .cs{background:none;font-family:var(--fb);font-size:15px;letter-spacing:.06em;padding:0}
.tr.hintp{animation:nudge 1s ease-in-out infinite}

/* Poderes */
.acts{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.ab{--cd:0;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;height:56px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--fd);font-size:15px;overflow:hidden;line-height:1}
.ab::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(8,4,6,.8) calc(var(--cd)*360deg),transparent 0);pointer-events:none}
.ab svg{width:26px;height:26px;flex:none}
.ab .t{position:absolute;z-index:1;font-size:24px;text-shadow:0 2px 3px #000}
.ab.cool .l{visibility:hidden}
.ab.th.ready{background:linear-gradient(180deg,#1e2a44,#141a2c);box-shadow:inset 0 0 0 2px var(--ice),0 0 18px rgba(140,192,255,.3)}
.ab.cr.ready{background:linear-gradient(180deg,#45240f,#2a160a);box-shadow:inset 0 0 0 2px var(--ember),0 0 18px rgba(255,154,46,.3)}
.ab.forge{background:linear-gradient(180deg,#4a2c16,#2a180c);box-shadow:inset 0 0 0 1px var(--gold-lo);color:var(--gold)}
.ab .dot{position:absolute;top:7px;right:8px;width:11px;height:11px;border-radius:50%;background:var(--blood-hi);box-shadow:0 0 8px var(--blood-hi);animation:pulse 1s infinite}

/* Forja */
.drawer{position:fixed;inset:auto 0 0 0;z-index:10;max-height:78%;display:flex;flex-direction:column;background:linear-gradient(180deg,#24151c,#170e14);border-top:2px solid var(--gold-lo);border-radius:20px 20px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6);animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .inner{max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dh{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
.dh h3{flex:1;margin:0;font-family:var(--fd);font-weight:400;font-size:24px;color:var(--gold)}
.dh .purse{height:36px;font-size:18px}
.x{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:26px;line-height:1;color:var(--mute)}
.ul{overflow-y:auto;min-height:0;padding-bottom:18px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}
.gh{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:8px;font-weight:600}
.u{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.u .n{font-size:22px;font-weight:600;line-height:1}
.u .n b{font-weight:500;color:var(--mute);font-size:18px;margin-left:5px}
.u .d{font-size:17px;color:var(--mute);line-height:1.05;margin-top:3px}
.u .d em{font-style:normal;color:var(--ok)}
.buy{min-width:96px;padding:10px 10px 7px;border-radius:11px;background:var(--card2);font-family:var(--fd);font-size:15px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px}
.buy .coin{width:15px;height:15px}
.u.can{box-shadow:inset 0 0 0 1px var(--gold-lo)}
.u.can .buy{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1700;box-shadow:0 3px 0 var(--gold-lo)}
.u.can .buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-lo)}
.u.maxed .buy{background:none;color:var(--ok)}

@keyframes pulse{50%{opacity:.45}}
@keyframes nudge{50%{transform:translateY(-5px)}}
@keyframes slam{from{transform:scale(2.4);opacity:0}}
@keyframes up{from{transform:translateY(40%);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="stg"><small id="best">Recorde: batalha 1</small><b id="stg">Batalha 1</b></div>
    <div class="purse"><span class="coin"></span><span id="gold">0</span></div>
    <button class="mute" id="mute" type="button" aria-label="Som ligado"></button>
  </header>

  <section class="field" id="field" aria-label="Campo de batalha">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner" hidden>
      <div class="in">
        <h2 id="bT"></h2>
        <p id="bP"></p>
        <div class="loot" id="bL"></div>
        <div class="btns" id="bB"></div>
      </div>
    </div>
  </section>

  <div class="fury"><i id="fury"></i><div class="ticks"></div><span><b>Fúria</b><b id="furyN">0/100</b></span></div>
  <div class="troops" id="troops"></div>
  <div class="acts">
    <button class="ab th" id="abT" type="button" aria-label="Martelo do trovão"><svg viewBox="0 0 24 24"><path d="M13.5 1.5L4 14h7l-1.5 8.5L20 9.5h-7z" fill="#8cc0ff" stroke="#e0eeff" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="l">Trovão</span><span class="t" id="abTt"></span></button>
    <button class="ab cr" id="abC" type="button" aria-label="Grito de guerra"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc07a" stroke-width="2" stroke-linecap="round"><path d="M3 9v6h4l7 5V4L7 9z" fill="#ff9a2e" stroke-linejoin="round"/><path d="M17 8.5c1.6 1.2 1.6 5.8 0 7M19.6 6c3.2 2.6 3.2 9.4 0 12"/></svg><span class="l">Grito</span><span class="t" id="abCt"></span></button>
    <button class="ab forge" id="abF" type="button"><svg viewBox="0 0 24 24" fill="#ffcb4c" stroke="#6a440a" stroke-width="1.2" stroke-linejoin="round"><path d="M2.5 8.5h13l3-3H21v5.5c-3 0-4.2 1.2-5 3H9C6.8 13 3.6 12 2.5 8.5z"/><path d="M8 14h8.5l1 4h-10.5z"/><path d="M5 19.5h14V22H5z"/></svg>Forja</button>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="inner">
    <div class="dh"><h3>Forja de guerra</h3><div class="purse"><span class="coin"></span><span id="gold2">0</span></div><button class="x" id="dx" type="button" aria-label="Fechar forja">×</button></div>
    <div class="ul" id="ul"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const KEY = 'furia-de-ferro-v1';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= Números ================= */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  n = Math.max(0, n);
  if (n < 1000) return String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUF.length) return n.toExponential(1).replace('.', ',');
  const v = n / Math.pow(10, e * 3);
  return (v < 10 ? (Math.floor(v * 100) / 100).toFixed(2) : v < 100 ? (Math.floor(v * 10) / 10).toFixed(1) : String(Math.floor(v))).replace('.', ',') + SUF[e];
}
const f1 = n => (Math.round(n * 10) / 10).toString().replace('.', ',');

/* ================= Dados ================= */
const TYPES = {
  bruto:   { range: 14,  speed: 42, rate: 0.9,  size: 1,    kind: 'melee',  kb: 34,  splash: 0,  as: 3.2 },
  arq:     { range: 150, speed: 36, rate: 1.25, size: 0.92, kind: 'ranged', kb: 14,  splash: 0,  as: 2.6 },
  colosso: { range: 16,  speed: 27, rate: 1.4,  size: 1.28, kind: 'melee',  kb: 90,  splash: 0,  as: 2.4 },
  tita:    { range: 22,  speed: 22, rate: 1.7,  size: 1.62, kind: 'melee',  kb: 170, splash: 46, as: 1.9 },
  boss:    { range: 26,  speed: 17, rate: 2.0,  size: 2.1,  kind: 'melee',  kb: 200, splash: 60, as: 1.7 },
};
const TROOPS = [
  { id: 'bruto',   n: 'Brutamonte', cost: 15,  hp: 60,  dmg: 12, unlock: 1, up: 15 },
  { id: 'arq',     n: 'Arqueira',   cost: 25,  hp: 34,  dmg: 9,  unlock: 2, up: 25 },
  { id: 'colosso', n: 'Colosso',    cost: 60,  hp: 270, dmg: 24, unlock: 3, up: 60 },
  { id: 'tita',    n: 'Titã',       cost: 150, hp: 950, dmg: 75, unlock: 6, up: 220 },
];
const FOES = [
  { type: 'bruto',   hp: 46,  dmg: 8,  gold: 3,  from: 1, w: 5 },
  { type: 'arq',     hp: 28,  dmg: 7,  gold: 4,  from: 2, w: 3 },
  { type: 'colosso', hp: 230, dmg: 19, gold: 11, from: 4, w: 1.6 },
  { type: 'tita',    hp: 820, dmg: 62, gold: 30, from: 9, w: 0.7 },
];
const BOSS = { type: 'boss', hp: 3200, dmg: 95, gold: 120 };

const unitM = L => Math.pow(1.15, L);
const baseHp = L => 500 * Math.pow(1.2, L);
const towerDmg = L => 7 * Math.pow(1.2, L);
const regen = L => 5 * Math.pow(1.08, L);
const cap = L => 100 + 15 * L;
const critC = L => 0.05 + 0.02 * L;
const lootM = L => 1 + 0.15 * L;
const thDmg = L => 60 * Math.pow(1.25, L);
const cryDur = L => 6 + L;
const tierOf = lv => lv >= 35 ? 4 : lv >= 20 ? 3 : lv >= 10 ? 2 : lv >= 5 ? 1 : 0;

const UPG = [
  ...TROOPS.map(t => ({ id: t.id, g: 'Tropas', n: t.n, c: t.up, k: 1.32, unlock: t.unlock, troop: true,
    d: L => { const a = unitM(L), b = unitM(L + 1); return `Vida ${fmt(t.hp * a)} <em>→ ${fmt(t.hp * b)}</em> · Dano ${fmt(t.dmg * a)} <em>→ ${fmt(t.dmg * b)}</em>`; } })),
  { id: 'wall', g: 'Fortaleza', n: 'Muralhas', c: 30, k: 1.4, d: L => `Vida da fortaleza ${fmt(baseHp(L))} <em>→ ${fmt(baseHp(L + 1))}</em>` },
  { id: 'tower', g: 'Fortaleza', n: 'Balista da torre', c: 40, k: 1.4, d: L => `Dano da torre ${fmt(towerDmg(L))} <em>→ ${fmt(towerDmg(L + 1))}</em>` },
  { id: 'regen', g: 'Poder', n: 'Tambores de guerra', c: 50, k: 1.5, max: 25, d: L => `Fúria ${f1(regen(L))}/s <em>→ ${f1(regen(L + 1))}/s</em>` },
  { id: 'cap', g: 'Poder', n: 'Estandarte', c: 40, k: 1.45, max: 30, d: L => `Fúria máxima ${cap(L)} <em>→ ${cap(L + 1)}</em>` },
  { id: 'crit', g: 'Poder', n: 'Golpe brutal', c: 120, k: 1.55, max: 18, d: L => `Crítico (dano ×3) ${Math.round(critC(L) * 100)}% <em>→ ${Math.round(critC(L + 1) * 100)}%</em>` },
  { id: 'loot', g: 'Poder', n: 'Saque', c: 100, k: 1.6, d: L => `Ouro +${L * 15}% <em>→ +${(L + 1) * 15}%</em>` },
  { id: 'thunder', g: 'Poderes', n: 'Martelo do trovão', c: 80, k: 1.45, d: L => `Dano em todos os inimigos ${fmt(thDmg(L))} <em>→ ${fmt(thDmg(L + 1))}</em>` },
  { id: 'cry', g: 'Poderes', n: 'Grito de guerra', c: 120, k: 1.5, max: 20, d: L => `+50% dano e velocidade por ${cryDur(L)} s <em>→ ${cryDur(L + 1)} s</em>` },
  { id: 'cmd', g: 'Comando', n: 'Comandante', c: 2500, once: true, unlock: 4, d: () => 'Convoca tropas sozinho quando a fúria está cheia' },
  { id: 'strat', g: 'Comando', n: 'Estrategista', c: 20000, once: true, unlock: 7, d: () => 'Usa o Trovão e o Grito sozinho na hora certa' },
];
const UPI = Object.fromEntries(UPG.map(u => [u.id, u]));
const upCost = u => u.once ? u.c : Math.ceil(u.c * Math.pow(u.k, S.lv[u.id] || 0));
const upMaxed = u => u.once ? (S.lv[u.id] || 0) >= 1 : !!(u.max && (S.lv[u.id] || 0) >= u.max);
const upVisible = u => !u.unlock || S.best >= u.unlock;

/* ================= Estado salvo ================= */
function fresh() { return { v: 1, stage: 1, best: 1, gold: 0, lv: {}, muted: false, wins: 0, kills: 0, tut: true }; }
let S = fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(data) {
  let raw = data && data.S ? data.S : null;
  if (!raw) { try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; } }
  if (raw && typeof raw === 'object') { S = Object.assign(fresh(), raw); S.lv = Object.assign({}, raw.lv || {}); }
}
const L = id => S.lv[id] || 0;

/* ================= Áudio ================= */
let AC = null, NOISE = null, MASTER = null, touched = false;
function audioInit() {
  touched = true;
  if (AC || S.muted) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createDynamicsCompressor(); MASTER.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
let sndBudget = 0;
function noise(dur, freq, vol, delay = 0, type = 'lowpass') {
  if (!AC || S.muted || sndBudget > 5) return; sndBudget++;
  try {
    const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NOISE; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(MASTER); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  } catch (e) {}
}
function tone(freq, dur, type, vol, delay = 0, to = 0) {

    ctx.globalAlpha = Math.min(1, G.streakT); ctx.lineWidth = 5; ctx.strokeStyle = '#1a0a0e'; ctx.fillStyle = '#ffcb4c';
    const t = `COMBO ×${G.streak}`; ctx.strokeText(t, W / 2, 62); ctx.fillText(t, W / 2, 62); ctx.globalAlpha = 1;
  }
  if (G.boss && G.bossOut && G.phase === 'fight' && G.t < 15.5) {
    ctx.textAlign = 'center'; ctx.font = `${Math.min(30, W / 13)}px "Black Ops One", Impact, sans-serif`;
    ctx.globalAlpha = Math.min(1, 15.5 - G.t); ctx.lineWidth = 6; ctx.strokeStyle = '#0a0410'; ctx.fillStyle = '#c8a0ff';
    ctx.strokeText('O REI CINZENTO CHEGOU', W / 2, H * 0.36); ctx.fillText('O REI CINZENTO CHEGOU', W / 2, H * 0.36); ctx.globalAlpha = 1;
  }
}

/* arrastar câmera */
let drag = null;
field.addEventListener('pointerdown', e => { if (e.target !== cv) return; drag = { x: e.clientX, cam: G.cam }; audioInit(); });
window.addEventListener('pointermove', e => { if (!drag) return; G.cam = drag.cam - (e.clientX - drag.x) / SC; G.camHold = 2.5; });
window.addEventListener('pointerup', () => { drag = null; });
window.addEventListener('pointercancel', () => { drag = null; });
document.addEventListener('contextmenu', e => e.preventDefault());

/* ================= UI ================= */
const FLAME = '<svg viewBox="0 0 10 12"><path d="M5 0C6 3 9 4.5 9 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1.5.6 2.4 1.4 2.8C4 5 4 2.5 5 0z" fill="currentColor"/></svg>';
const troopsEl = $('#troops');
const trBtns = TROOPS.map((t, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tr';
  b.innerHTML = `<span class="fill"></span><span class="lv"></span><canvas></canvas><span class="meta"><span class="nm">${t.n}</span><span class="cs"></span></span>`;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); trySpawn(i); });
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trySpawn(i); } });
  troopsEl.appendChild(b);
  return { b, c: b.querySelector('canvas'), fill: b.querySelector('.fill'), lv: b.querySelector('.lv'), cs: b.querySelector('.cs'), key: '', st: {} };
});
function paintIcons(force) {
  TROOPS.forEach((t, i) => {
    const r = trBtns[i], tier = tierOf(L(t.id));
    const cw = r.c.clientWidth, ch = r.c.clientHeight;
    if (!cw || !ch) return;
    const key = tier + '|' + cw + 'x' + ch;
    if (r.key === key && !force) return; r.key = key;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    r.c.width = Math.round(cw * d); r.c.height = Math.round(ch * d);
    const c = r.c.getContext('2d');
    const s = 7 * TYPES[t.id].size;
    const k = Math.min(ch * 0.86 / (s * 4.6), cw * 0.8 / (s * 3.2));
    c.setTransform(d * k, 0, 0, d * k, cw * d / 2 - s * 0.2 * k * d, ch * d * 0.97);
    drawWarrior(c, t.id, 1, tier, 0, -1);
  });
}
const setT = (el, v) => { if (el.textContent !== v) el.textContent = v; };
const tog = (el, c, on) => { if (el.classList.contains(c) !== on) el.classList.toggle(c, on); };
const furyEl = $('#fury'), furyN = $('#furyN'), goldEl = $('#gold'), gold2 = $('#gold2'), stgEl = $('#stg'), bestEl = $('#best');
const abT = $('#abT'), abC = $('#abC'), abTt = $('#abTt'), abCt = $('#abCt'), abF = $('#abF');
let lastFury = -1;
function updateHud() {
  setT(stgEl, `Batalha ${S.stage}`);
  setT(bestEl, `Recorde: batalha ${S.best}`);
  const gs = fmt(S.gold); setT(goldEl, gs); setT(gold2, gs);
  if (!G) return;
  const cp = cap(L('cap'));
  const fr = Math.round(G.energy / cp * 400) / 400;
  if (fr !== lastFury) { furyEl.style.transform = `scaleX(${fr})`; lastFury = fr; }
  setT(furyN, `${Math.floor(G.energy)}/${cp}`);
  TROOPS.forEach((t, i) => {
    const r = trBtns[i], locked = S.best < t.unlock;
    tog(r.b, 'locked', locked);
    if (locked) setT(r.cs, `Batalha ${t.unlock}`);
    else if (r.cs.dataset.c !== String(t.cost)) { r.cs.dataset.c = String(t.cost); r.cs.innerHTML = FLAME + t.cost; }
    if (locked) delete r.cs.dataset.c;
    setT(r.lv, locked ? '' : 'Nv ' + (L(t.id) + 1));
    tog(r.b, 'ok', !locked && G.energy >= t.cost && G.phase === 'fight');
    const p = locked ? 0 : Math.round(Math.min(1, G.energy / t.cost) * 50) / 50;
    if (r.st.p !== p) { r.st.p = p; r.fill.style.transform = `scaleY(${p})`; }
  });
  const cT = Math.round(G.cdTh / 28 * 100) / 100, cC = Math.round(G.cdCry / 32 * 100) / 100;
  if (abT._c !== cT) { abT._c = cT; abT.style.setProperty('--cd', cT); }
  if (abC._c !== cC) { abC._c = cC; abC.style.setProperty('--cd', cC); }
  tog(abT, 'ready', G.cdTh <= 0 && G.phase === 'fight'); tog(abC, 'ready', G.cdCry <= 0 && G.phase === 'fight');
  tog(abT, 'cool', G.cdTh > 0); tog(abC, 'cool', G.cdCry > 0);
  setT(abTt, G.cdTh > 0 ? String(Math.ceil(G.cdTh)) : '');
  setT(abCt, G.cdCry > 0 ? String(Math.ceil(G.cdCry)) : '');
  const any = UPG.some(u => upVisible(u) && !upMaxed(u) && S.gold >= upCost(u));
  let d = abF.querySelector('.dot');
  if (any && !d) { d = document.createElement('span'); d.className = 'dot'; abF.appendChild(d); } else if (!any && d) d.remove();
}
abT.addEventListener('click', () => { audioInit(); useThunder(); });
abC.addEventListener('click', () => { audioInit(); useCry(); });
abF.addEventListener('click', () => { audioInit(); openForge(); });
$('#dx').addEventListener('click', closeForge);

const muteBtn = $('#mute');
function paintMute() {
  muteBtn.innerHTML = S.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
  muteBtn.setAttribute('aria-label', S.muted ? 'Som desligado' : 'Som ligado');
}
muteBtn.addEventListener('click', () => { S.muted = !S.muted; if (!S.muted) audioInit(); paintMute(); save(); });

let upRefs = [];
function openForge() {
  const ul = $('#ul'); ul.innerHTML = ''; upRefs = [];
  let lastG = '';
  for (const u of UPG) {
    if (!upVisible(u)) continue;
    if (u.g !== lastG) { lastG = u.g; const h = document.createElement('div'); h.className = 'gh'; h.textContent = u.g; ul.appendChild(h); }
    const el = document.createElement('div'); el.className = 'u';
    el.innerHTML = '<div style="min-width:0"><div class="n"></div><div class="d"></div></div><button type="button" class="buy"></button>';
    el.querySelector('.buy').addEventListener('click', () => { audioInit(); buyUp(u.id); });
    ul.appendChild(el);
    upRefs.push({ u, el, n: el.querySelector('.n'), d: el.querySelector('.d'), b: el.querySelector('.buy'), k: '' });
  }
  $('#drawer').hidden = false;
  updForge();
}
function closeForge() { $('#drawer').hidden = true; }
function updForge() {
  if ($('#drawer').hidden) return;
  for (const r of upRefs) {
    const u = r.u, lv = L(u.id), mx = upMaxed(u), c = upCost(u);
    const key = lv + '|' + mx;
    if (r.k !== key) {
      r.k = key;
      r.n.innerHTML = u.n + (u.once ? '' : ` <b>Nv ${lv + (u.troop ? 1 : 0)}</b>`);
      r.d.innerHTML = mx && !u.once ? u.d(lv - 1).replace(/ <em>.*?<\/em>/g, '') : u.d(lv);
      r.b.innerHTML = mx ? (u.once ? 'Ativo' : 'Máximo') : `<span class="coin"></span>${fmt(c)}`;
    }
    tog(r.el, 'maxed', mx);
    tog(r.el, 'can', !mx && S.gold >= c);
  }
}
function buyUp(id) {
  const u = UPI[id]; if (!u || upMaxed(u)) return;
  const c = upCost(u);
  if (S.gold < c) { sfx.no(); return; }
  S.gold -= c; S.lv[id] = L(id) + 1;
  if (id === 'wall' && G && G.phase === 'fight') { const add = baseHp(L('wall')) - G.b1.max; G.b1.max += add; G.b1.hp += add; }
  sfx.buy(); buzz(15);
  paintIcons(); save(); updForge(); updateHud();
}

/* ================= Loop ================= */
let last = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  sndBudget = Math.max(0, sndBudget - dt * 40);
  let sim = dt;
  if (G.freeze > 0) { G.freeze -= dt; sim = 0; }
  if (G.slow > 0) { G.slow -= dt; sim *= 0.3; }
  if (sim > 0) step(sim);
  render(dt);
  uiT += dt; saveT += dt;
  if (uiT > 0.1) { uiT = 0; updateHud(); updForge(); }
  if (saveT > 8) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
try { new ResizeObserver(() => paintIcons()).observe(troopsEl); } catch (e) {}

function start(data) {
  load(data);
  resize();
  paintMute();
  newBattle();
  paintIcons(true);
  if (S.tut) trBtns[0].b.classList.add('hintp');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => paintIcons(true));
  last = performance.now();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
const hot = window.claude?.hot;
if (hot && hot.ready) hot.ready(start); else start(hot?.data ?? {});
})();
</script>
