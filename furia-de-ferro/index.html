<title>Fúria de Ferro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#140d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Teko:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone war app. War-chest HUD, dusk battlefield canvas, fury bar, troop grid, powers row, forge drawer. */
:root{
  color-scheme:dark;
  --bg:#140d12; --bg2:#1f141b; --card:#2a1b23; --card2:#36222c; --line:#4a2f3b;
  --ink:#f4e9df; --mute:#b39a92; --dim:#76605c;
  --blood:#d4302a; --blood-hi:#ff5a3c; --ember:#ff9a2e; --gold:#ffc94a; --gold-lo:#9c6a12;
  --ice:#7fb6ff; --void:#8a4dd6; --ok:#7de38f;
  --fd:'Black Ops One','Impact','Arial Black',sans-serif;
  --fb:'Teko','Arial Narrow','Roboto Condensed',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:18px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 12px}
@media (min-width:380px){#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.stg{font-family:var(--fd);font-size:24px;line-height:1;letter-spacing:.02em}
.stg small{display:block;font-family:var(--fb);font-size:15px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.purse{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--gold-lo)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b8,var(--gold) 45%,var(--gold-lo));box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}

.field{position:relative;flex:1 1 auto;min-height:220px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);touch-action:none}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,5,8,.62);padding:16px;z-index:4}
.banner .in{text-align:center;max-width:340px;animation:slam .45s cubic-bezier(.2,1.8,.4,1)}
.banner h2{margin:0;font-family:var(--fd);font-weight:400;font-size:44px;line-height:1;letter-spacing:.02em;text-shadow:0 4px 0 rgba(0,0,0,.6)}
.banner.win h2{color:var(--gold)}
.banner.lose h2{color:var(--blood-hi)}
.banner p{margin:8px 0 0;font-size:20px;color:var(--ink);line-height:1.15}
.banner .loot{font-family:var(--fd);font-size:28px;color:var(--gold);margin-top:6px}
.banner .btns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 18px 7px;border-radius:10px;font-family:var(--fd);font-size:17px;letter-spacing:.02em;background:var(--blood);color:#fff;box-shadow:0 4px 0 #7a1410}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1410}
.btn.alt{background:var(--card2);box-shadow:0 4px 0 #120a0e;color:var(--gold)}

.fury{position:relative;height:22px;border-radius:7px;background:#0b0709;border:1px solid var(--line);overflow:hidden}
.fury i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7a1410,var(--blood),var(--ember));box-shadow:0 0 16px var(--blood)}
.fury span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:2px 10px 0;font-size:17px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}

.troops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tr{--p:0;position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden;min-width:0;transition:transform .05s}
.tr::before{content:"";position:absolute;inset:auto 0 0 0;height:calc(var(--p)*100%);background:rgba(212,48,42,.18);pointer-events:none}
.tr.ok{border-color:var(--blood);background:var(--card2);box-shadow:0 0 0 1px rgba(212,48,42,.35),0 0 18px rgba(212,48,42,.25)}
.tr:active{transform:scale(.94)}
.tr canvas{width:52px;height:52px;position:relative}
.tr .nm{position:relative;font-size:16px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tr .cs{position:relative;font-family:var(--fd);font-size:14px;color:var(--ember);line-height:1.2}
.tr .lv{position:absolute;top:4px;left:5px;font-size:14px;font-weight:600;color:var(--mute)}
.tr.locked{opacity:.45;pointer-events:none}
.tr.locked .cs{color:var(--mute);font-family:var(--fb);font-size:14px;letter-spacing:.04em}

.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ab{--cd:0;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:54px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-family:var(--fd);font-size:14px;letter-spacing:.02em;overflow:hidden;line-height:1}
.ab::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(10,5,8,.78) calc(var(--cd)*360deg),transparent 0);pointer-events:none}
.ab svg{width:24px;height:24px;flex:none}
.ab.ready{border-color:var(--ice);box-shadow:0 0 16px rgba(127,182,255,.3)}
.ab.ready.cry{border-color:var(--ember);box-shadow:0 0 16px rgba(255,154,46,.3)}
.ab.cool .l{visibility:hidden}
.ab .t{position:absolute;z-index:1;font-size:20px;text-shadow:0 2px 3px #000}
.ab.forge{background:linear-gradient(180deg,#4a2a18,#2a1810);border-color:var(--gold-lo);color:var(--gold)}
.ab .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--blood-hi);box-shadow:0 0 8px var(--blood-hi);animation:pulse 1s infinite}
.hintp{animation:nudge 1s ease-in-out infinite}

.drawer{position:fixed;inset:auto 0 0 0;z-index:10;max-height:76%;display:flex;flex-direction:column;background:var(--bg2);border-top:2px solid var(--gold-lo);border-radius:18px 18px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6);animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .inner{max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:10px}
.dh h3{margin:0;font-family:var(--fd);font-weight:400;font-size:24px;color:var(--gold)}
.x{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:24px;line-height:1;color:var(--mute)}
.ul{overflow-y:auto;min-height:0;padding-bottom:16px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.gh{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:8px;font-weight:600}
.u{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.u .n{font-size:21px;font-weight:600;line-height:1}
.u .n b{font-weight:500;color:var(--mute);font-size:17px;margin-left:4px}
.u .d{font-size:16px;color:var(--mute);line-height:1.1;margin-top:2px}
.u .d em{font-style:normal;color:var(--ok)}
.buy{min-width:92px;padding:9px 10px 6px;border-radius:10px;background:var(--card2);font-family:var(--fd);font-size:15px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px}
.buy .coin{width:14px;height:14px}
.u.can .buy{background:var(--gold);color:#2a1700;box-shadow:0 3px 0 var(--gold-lo)}
.u.can .buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-lo)}
.u.maxed .buy{background:none;color:var(--ok)}

@keyframes pulse{50%{opacity:.5}}
@keyframes nudge{50%{transform:translateY(-4px);box-shadow:0 0 22px rgba(255,90,60,.6)}}
@keyframes slam{from{transform:scale(2.2);opacity:0}}
@keyframes up{from{transform:translateY(40%);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="stg"><small id="best">Recorde: batalha 1</small><span id="stg">Batalha 1</span></div>
    <div class="purse"><span class="coin"></span><span id="gold">0</span></div>
  </header>

  <section class="field" id="field" aria-label="Campo de batalha">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner" hidden>
      <div class="in">
        <h2 id="bT"></h2>
        <p id="bP"></p>
        <div class="loot" id="bL"></div>
        <div class="btns" id="bB"></div>
      </div>
    </div>
  </section>

  <div class="fury"><i id="fury"></i><span><b>Fúria</b><b id="furyN">0/100</b></span></div>
  <div class="troops" id="troops"></div>
  <div class="acts">
    <button class="ab" id="abT" type="button" aria-label="Martelo do trovão"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#7fb6ff" stroke="#cfe2ff"/></svg><span class="l">Trovão</span><span class="t" id="abTt"></span></button>
    <button class="ab cry" id="abC" type="button" aria-label="Grito de guerra"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb35c" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l6 5V4L8 9z" fill="#ff9a2e"/><path d="M17 8c1.5 1 1.5 7 0 8M19.5 5.5c3 2.5 3 10.5 0 13"/></svg><span class="l">Grito</span><span class="t" id="abCt"></span></button>
    <button class="ab forge" id="abF" type="button"><svg viewBox="0 0 24 24" fill="#ffc94a" stroke="#9c6a12" stroke-width="1.2"><path d="M3 9h13l3-3h2v5c-3 0-4 1-5 3H9c-2-1-5-2-6-5z"/><path d="M8 14h8l1 4H7z"/><path d="M5 20h14v2H5z"/></svg>Forja</button>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="inner">
    <div class="dh"><h3>Forja de guerra</h3><button class="x" id="dx" type="button" aria-label="Fechar forja">×</button></div>
    <div class="ul" id="ul"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const KEY = 'furia-de-ferro-v1';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= Números ================= */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  n = Math.max(0, n);
  if (n < 1000) return String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUF.length) return n.toExponential(1).replace('.', ',');
  const v = n / Math.pow(10, e * 3);
  return (v < 10 ? (Math.floor(v * 100) / 100).toFixed(2) : v < 100 ? (Math.floor(v * 10) / 10).toFixed(1) : String(Math.floor(v))).replace('.', ',') + SUF[e];
}
const f1 = n => (Math.round(n * 10) / 10).toString().replace('.', ',');

/* ================= Dados ================= */
const TYPES = {
  bruto:   { range: 14,  speed: 42, rate: 0.85, size: 1,    kind: 'melee',  kb: 30,  splash: 0 },
  arq:     { range: 150, speed: 36, rate: 1.2,  size: 0.9,  kind: 'ranged', kb: 12,  splash: 0 },
  colosso: { range: 16,  speed: 27, rate: 1.35, size: 1.3,  kind: 'melee',  kb: 80,  splash: 0 },
  tita:    { range: 22,  speed: 22, rate: 1.6,  size: 1.7,  kind: 'melee',  kb: 150, splash: 46 },
  boss:    { range: 26,  speed: 17, rate: 1.9,  size: 2.25, kind: 'melee',  kb: 190, splash: 60 },
};
const TROOPS = [
  { id: 'bruto',   n: 'Brutamonte', cost: 15,  hp: 60,  dmg: 12, unlock: 1, up: 15 },
  { id: 'arq',     n: 'Arqueira',   cost: 25,  hp: 34,  dmg: 9,  unlock: 2, up: 25 },
  { id: 'colosso', n: 'Colosso',    cost: 60,  hp: 270, dmg: 24, unlock: 3, up: 60 },
  { id: 'tita',    n: 'Titã',       cost: 150, hp: 950, dmg: 75, unlock: 6, up: 220 },
];
const FOES = [
  { type: 'bruto',   n: 'Saqueador', hp: 46,  dmg: 8,  gold: 3,  from: 1, w: 5 },
  { type: 'arq',     n: 'Besteiro',  hp: 28,  dmg: 7,  gold: 4,  from: 2, w: 3 },
  { type: 'colosso', n: 'Ogro',      hp: 230, dmg: 19, gold: 11, from: 4, w: 1.6 },
  { type: 'tita',    n: 'Behemoth',  hp: 820, dmg: 62, gold: 30, from: 9, w: 0.7 },
];
const BOSS = { type: 'boss', n: 'Rei Cinzento', hp: 3200, dmg: 95, gold: 120 };

const unitM = L => Math.pow(1.15, L);
const baseHp = L => 500 * Math.pow(1.2, L);
const towerDmg = L => 7 * Math.pow(1.2, L);
const regen = L => 5 * Math.pow(1.08, L);
const cap = L => 100 + 15 * L;
const critC = L => 0.05 + 0.02 * L;
const lootM = L => 1 + 0.15 * L;
const thDmg = L => 60 * Math.pow(1.25, L);
const cryDur = L => 6 + L;

const UPG = [
  ...TROOPS.map(t => ({ id: t.id, g: 'Tropas', n: t.n, c: t.up, k: 1.32, unlock: t.unlock,
    d: L => { const a = unitM(L), b = unitM(L + 1); return `Vida ${fmt(t.hp * a)} <em>→ ${fmt(t.hp * b)}</em> · Dano ${fmt(t.dmg * a)} <em>→ ${fmt(t.dmg * b)}</em>`; } })),
  { id: 'wall', g: 'Fortaleza', n: 'Muralhas', c: 30, k: 1.4, d: L => `Vida da fortaleza ${fmt(baseHp(L))} <em>→ ${fmt(baseHp(L + 1))}</em>` },
  { id: 'tower', g: 'Fortaleza', n: 'Balista da torre', c: 40, k: 1.4, d: L => `Dano da torre ${fmt(towerDmg(L))} <em>→ ${fmt(towerDmg(L + 1))}</em>` },
  { id: 'regen', g: 'Poder', n: 'Tambores de guerra', c: 50, k: 1.5, max: 25, d: L => `Fúria ${f1(regen(L))}/s <em>→ ${f1(regen(L + 1))}/s</em>` },
  { id: 'cap', g: 'Poder', n: 'Estandarte', c: 40, k: 1.45, max: 30, d: L => `Fúria máxima ${cap(L)} <em>→ ${cap(L + 1)}</em>` },
  { id: 'crit', g: 'Poder', n: 'Golpe brutal', c: 120, k: 1.55, max: 18, d: L => `Crítico (dano ×3) ${Math.round(critC(L) * 100)}% <em>→ ${Math.round(critC(L + 1) * 100)}%</em>` },
  { id: 'loot', g: 'Poder', n: 'Saque', c: 100, k: 1.6, d: L => `Ouro +${L * 15}% <em>→ +${(L + 1) * 15}%</em>` },
  { id: 'thunder', g: 'Poderes', n: 'Martelo do trovão', c: 80, k: 1.45, d: L => `Dano em todos os inimigos ${fmt(thDmg(L))} <em>→ ${fmt(thDmg(L + 1))}</em>` },
  { id: 'cry', g: 'Poderes', n: 'Grito de guerra', c: 120, k: 1.5, max: 20, d: L => `Tropas +50% dano e velocidade por ${cryDur(L)} s <em>→ ${cryDur(L + 1)} s</em>` },
  { id: 'cmd', g: 'Comando', n: 'Comandante', c: 2500, once: true, unlock: 4, d: () => 'Convoca tropas sozinho quando a fúria está cheia' },
  { id: 'strat', g: 'Comando', n: 'Estrategista', c: 20000, once: true, unlock: 7, d: () => 'Usa o Trovão e o Grito sozinho na hora certa' },
];
const UPI = Object.fromEntries(UPG.map(u => [u.id, u]));
const upCost = u => u.once ? u.c : Math.ceil(u.c * Math.pow(u.k, S.lv[u.id] || 0));
const upMaxed = u => u.once ? (S.lv[u.id] || 0) >= 1 : (u.max && (S.lv[u.id] || 0) >= u.max);
const upVisible = u => !u.unlock || S.best >= u.unlock;

/* ================= Estado salvo ================= */
function fresh() { return { v: 1, stage: 1, best: 1, gold: 0, lv: {}, muted: false, wins: 0, kills: 0, tut: true }; }
let S = fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(data) {
  let raw = data && data.S ? data.S : null;
  if (!raw) { try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; } }
  if (raw && typeof raw === 'object') { S = Object.assign(fresh(), raw); S.lv = Object.assign({}, raw.lv || {}); }
}
const L = id => S.lv[id] || 0;

/* ================= Áudio ================= */
let AC = null, NOISE = null;
function audioInit() {
  touched = true;
  if (AC || S.muted) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
let sndCount = 0;
setInterval(() => { sndCount = 0; }, 100);
function noise(dur, freq, vol, delay = 0, type = 'lowpass') {
  if (!AC || S.muted || sndCount > 6) return; sndCount++;
  try {
    const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NOISE; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  } catch (e) {}
}
function tone(freq, dur, type, vol, delay = 0, to = 0) {
  if (!AC || S.muted) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  hit: () => noise(0.07, 1800, 0.12),
  heavy: () => { tone(110, 0.25, 'sine', 0.5, 0, 35); noise(0.18, 600, 0.3); },
  crit: () => { tone(160, 0.2, 'square', 0.12, 0, 50); noise(0.12, 3000, 0.22); },
  shoot: () => noise(0.05, 4000, 0.04, 0, 'highpass'),
  horn: () => { tone(98, 0.35, 'sawtooth', 0.09, 0, 130); tone(147, 0.35, 'sawtooth', 0.05); },
  thunder: () => { noise(1.4, 400, 0.7); tone(70, 1, 'sine', 0.6, 0, 25); noise(0.25, 5000, 0.4, 0, 'highpass'); },
  cry: () => { tone(220, 0.6, 'sawtooth', 0.12, 0, 330); tone(110, 0.6, 'sawtooth', 0.1, 0, 165); noise(0.5, 900, 0.2); },
  coin: () => tone(1300 + Math.random() * 300, 0.07, 'square', 0.025),
  buy: () => { tone(500, 0.08, 'square', 0.06); tone(750, 0.12, 'square', 0.06, 0.07); },
  boom: () => { tone(60, 1.5, 'sine', 0.8, 0, 20); noise(1.6, 300, 0.8); },
  win: () => [262, 330, 392, 523, 659].forEach((f, i) => tone(f, 0.35, 'sawtooth', 0.07, 0.25 + i * 0.12)),
  lose: () => [196, 165, 131, 98].forEach((f, i) => tone(f, 0.5, 'sawtooth', 0.08, 0.2 + i * 0.25)),
  no: () => tone(90, 0.1, 'square', 0.05),
};
let touched = false;
function buzz(p) { if (!touched) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

/* ================= Desenho dos guerreiros ================= */
const TIER_P = ['#7b5236', '#b8743c', '#a9b4bd', '#f0be45', '#3b2b47'];
const TIER_E = ['#4b4a57', '#5d4a72', '#6f7f8f', '#9b8a3a', '#1b1b22'];
function drawWarrior(c, type, side, tier, walk, atk, flash, alpha) {
  const T = TYPES[type], s = 7 * T.size * (1 + tier * 0.04);
  const P = side > 0;
  const skin = P ? '#e2a678' : '#9fb0b0';

  const armor = (P ? TIER_P : TIER_E)[tier];
  const dark = 'rgba(0,0,0,.55)';

  c.beginPath(); c.roundRect(-s * 0.7, -s * 2.45, s * 1.4, s * 1.45, s * 0.3); c.stroke();
  // cabeça

  c.beginPath(); c.arc(s * 0.05, -s * 2.95, s * 0.55, 0, TAU); c.fill(); c.stroke();
  // elmo
  c.fillStyle = armor;
  c.beginPath(); c.arc(s * 0.05, -s * 3.05, s * 0.6, Math.PI, 0); c.fill(); c.stroke();
  if (P) { // crista
    c.fillStyle = cloth; c.beginPath(); c.moveTo(-s * 0.4, -s * 3.6); c.quadraticCurveTo(s * 0.2, -s * 4.2, s * 0.5, -s * 3.5); c.lineTo(s * 0.1, -s * 3.5); c.fill();
  } else { // chifres

    c.beginPath(); c.moveTo(s * 0.45, -s * 3.3); c.quadraticCurveTo(s * 1, -s * 3.6, s * 0.85, -s * 4.1); c.lineTo(s * 0.3, -s * 3.5); c.fill();

  // arma
  const a = atk > 0 ? (atk > 0.6 ? -1.9 * (1 - (atk - 0.6) / 0.4) : -1.9 + (0.6 - atk) / 0.6 * 3.3) : -0.4;
  c.save(); c.translate(s * 0.35, -s * 2.0);

    c.beginPath(); c.arc(s * 0.2, 0, s * 1.1, -1.25, 1.25); c.stroke();
    c.strokeStyle = '#e8e0d0'; c.lineWidth = Math.max(1, s * 0.06);

    c.beginPath(); c.moveTo(s * 0.2 + Math.cos(-1.25) * s * 1.1, Math.sin(-1.25) * s * 1.1); c.lineTo(-pull + s * 0.1, 0); c.lineTo(s * 0.2 + Math.cos(1.25) * s * 1.1, Math.sin(1.25) * s * 1.1); c.stroke();

      c.beginPath(); c.moveTo(-s * 0.18, -s * 0.3); c.lineTo(-s * 0.18, -s * 2.9); c.lineTo(0, -s * 3.3); c.lineTo(s * 0.18, -s * 2.9); c.lineTo(s * 0.18, -s * 0.3); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#6b3e1e'; c.fillRect(-s * 0.45, -s * 0.35, s * 0.9, s * 0.18);

  if (type === 'bruto' || type === 'colosso' || type === 'boss') {
    c.fillStyle = P ? '#8a1a14' : '#3a1d55'; c.strokeStyle = armor; c.lineWidth = s * 0.16;
    c.beginPath(); c.arc(s * 0.75, -s * 1.7, s * 0.55, 0, TAU); c.fill(); c.stroke();

    c.beginPath(); c.moveTo(-s * 0.5, -s * 3.55); c.lineTo(-s * 0.5, -s * 4.0); c.lineTo(-s * 0.2, -s * 3.75); c.lineTo(s * 0.05, -s * 4.15); c.lineTo(s * 0.3, -s * 3.75); c.lineTo(s * 0.6, -s * 4.0); c.lineTo(s * 0.6, -s * 3.55); c.fill();

}

/* ================= Campo ================= */
const WW = 900, B1X = 40, B2X = 860, BHW = 26;
const field = $('#field'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, VIEW = 400, GY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = field.clientWidth; H = field.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  SC = clamp(H / 250, W / 440, W / 310);
  VIEW = Math.min(WW + 40, W / SC);
  GY = H - Math.max(26, H * 0.12);
}
try { new ResizeObserver(resize).observe(field); } catch (e) { window.addEventListener('resize', resize); }
resize();

// montanhas
const MTN = [[], []];
for (let l = 0; l < 2; l++) for (let i = 0; i <= 60; i++) MTN[l].push(Math.sin(i * 0.7 + l * 3) * 0.5 + Math.sin(i * 1.9 + l) * 0.3 + Math.random() * 0.4);

const EMB = Array.from({ length: 28 }, () => ({ x: Math.random() * 600, y: Math.random() * 500, v: rnd(8, 30), s: rnd(1.5, 3), ph: Math.random() * 3 }));

/* ================= Batalha ================= */
let G = null;
function newBattle() {
  const st = S.stage, m = Math.pow(1.17, st - 1);
  G = {
    units: [], projs: [], parts: [], floats: [], bolts: [],
    b1: { isBase: true, side: 1, x: B1X, hp: baseHp(L('wall')), max: baseHp(L('wall')), flash: 0 },
    b2: { isBase: true, side: -1, x: B2X, hp: 300 * Math.pow(1.22, st - 1), max: 300 * Math.pow(1.22, st - 1), flash: 0 },
    m, energy: 40, eT: 2.5, t: 0, boss: st % 5 === 0, bossOut: false,
    tc1: 0, tc2: 0, cdTh: 0, cdCry: 0, cry: 0, phase: 'fight', endT: 0,
    streak: 0, streakT: 0, earned: 0, kills: 0, cam: 0, camHold: 0, shake: 0, freeze: 0, slow: 0, flash: 0, flashC: '255,255,255',
  };
  G.cam = 0;
  $('#banner').hidden = true;
  updateHud();
}

function spawnP(i) {
  const t = TROOPS[i], ty = TYPES[t.id], lv = L(t.id), m = unitM(lv);
  const tier = lv >= 35 ? 4 : lv >= 20 ? 3 : lv >= 10 ? 2 : lv >= 5 ? 1 : 0;
  addUnit(1, t.id, t.hp * m, t.dmg * m, tier, 0, false);
}
function spawnE(f, boss) {
  const tier = Math.min(4, Math.floor((S.stage - 1) / 6));
  addUnit(-1, f.type, f.hp * G.m, f.dmg * G.m, tier, f.gold * Math.pow(1.22, S.stage - 1), boss);
}
function addUnit(side, type, hp, dmg, tier, gold, boss) {
  const T = TYPES[type];
  const size = T.size * (1 + tier * 0.04);
  G.units.push({ side, type, tier, x: side > 0 ? B1X + 24 - Math.random() * 4 : B2X - 24 + Math.random() * 4, hp, max: hp, dmg, rate: T.rate, cd: Math.random() * 0.4, range: T.range, speed: T.speed * rnd(0.95, 1.05), r: 7 * size, size, kind: T.kind, kb: 0, splash: T.splash, kbF: T.kb, walk: Math.random() * 6, atk: 0, flash: 0, dead: false, dt: 0, gold, boss, moving: true });
}

function trySpawn(i) {
  if (!G || G.phase !== 'fight') return;
  const t = TROOPS[i];
  if (S.best < t.unlock) return;
  if (G.energy < t.cost) { sfx.no(); return; }
  G.energy -= t.cost;
  spawnP(i);
  sfx.horn(); buzz(12);
  if (S.tut) { S.tut = false; document.querySelector('.tr')?.classList.remove('hintp'); }
}

function useThunder(auto) {
  if (!G || G.phase !== 'fight' || G.cdTh > 0) return;
  G.cdTh = 28;
  const dmg = thDmg(L('thunder'));
  const foes = G.units.filter(u => !u.dead && u.side < 0);
  for (const e of foes) {
    G.bolts.push({ x: e.x, t: 0 });
    hurt(e, dmg * rnd(0.9, 1.1), null, true, 120);
  }
  if (!foes.length) G.bolts.push({ x: G.cam + VIEW * 0.6, t: 0 });
  G.shake = Math.max(G.shake, 16); G.flash = 0.35; G.flashC = '200,225,255'; G.freeze = 0.08;
  sfx.thunder(); buzz([40, 30, 80]);
}
function useCry() {
  if (!G || G.phase !== 'fight' || G.cdCry > 0) return;
  G.cdCry = 32; G.cry = cryDur(L('cry'));
  G.flash = 0.2; G.flashC = '255,120,40'; G.shake = Math.max(G.shake, 6);
  for (const u of G.units) if (!u.dead && u.side > 0) for (let k = 0; k < 6; k++) part(u.x, -u.r * 2, rnd(-60, 60), rnd(-160, -60), 0.6, '255,140,40', 3);
  sfx.cry(); buzz([20, 20, 20]);
}

function part(x, y, vx, vy, life, col, sz, g = 500) { if (G.parts.length < 500) G.parts.push({ x, y, vx, vy, life, t: 0, col, sz, g }); }
function floatTxt(x, y, txt, col, size) { G.floats.push({ x, y, txt, col, size, t: 0 }); if (G.floats.length > 60) G.floats.shift(); }

function hurt(tg, amt, src, crit, kbF) {
  if (tg.isBase) {
    if (G.phase !== 'fight') return;
    tg.hp -= amt; tg.flash = 0.1;
    floatTxt(tg.x + rnd(-10, 10), -70 - rnd(0, 20), fmt(amt), tg.side > 0 ? '255,90,60' : '255,230,170', crit ? 24 : 15);
    for (let k = 0; k < 4; k++) part(tg.x - tg.side * BHW, -rnd(10, 60), -tg.side * rnd(20, 120), rnd(-150, -40), 0.6, '170,150,140', 3);
    if (tg.hp <= 0) endBattle(tg.side < 0);
    return;
  }
  if (tg.dead) return;
  tg.hp -= amt; tg.flash = 0.09;
  tg.kb += (kbF || 20) * (crit ? 2 : 1) / tg.size;
  const enemyHit = tg.side < 0;
  const col = enemyHit ? (crit ? '255,70,40' : '255,236,190') : '255,120,120';
  floatTxt(tg.x + rnd(-6, 6), -tg.r * 4.2, (crit ? fmt(amt) + '!' : fmt(amt)), col, crit ? 26 : (enemyHit ? 16 : 13));
  const n = crit ? 12 : 5;
  for (let k = 0; k < n; k++) part(tg.x, -tg.r * rnd(1.2, 2.6), rnd(-140, 140), rnd(-220, -40), rnd(0.3, 0.6), crit ? '255,90,40' : '255,200,120', crit ? 3.5 : 2.5);
  if (tg.hp <= 0) kill(tg, crit);
}
function kill(u, big) {
  u.dead = true; u.dt = 0;
  u.vx = -u.side * rnd(80, 180) * (big ? 1.8 : 1) / Math.sqrt(u.size);
  u.vy = -rnd(140, 260) * (big ? 1.4 : 1) / Math.sqrt(u.size);
  u.spin = -u.side * rnd(4, 9); u.rot = 0; u.y = 0;
  for (let k = 0; k < 10; k++) part(u.x, -u.r * 2, rnd(-120, 120), rnd(-240, -60), rnd(0.4, 0.8), '200,170,140', 3);
  if (u.side < 0) {
    G.streak++; G.streakT = 3; G.kills++; S.kills++;
    const sm = 1 + Math.min(1, G.streak * 0.05);
    const g = u.gold * lootM(L('loot')) * sm * (u.boss ? 20 : 1);
    S.gold += g; G.earned += g;
    floatTxt(u.x, -u.r * 5.2, '+' + fmt(g), '255,201,74', u.boss ? 30 : 17);
    sfx.coin();
    if (u.boss) { G.shake = 22; G.slow = 1.2; G.flash = 0.3; G.flashC = '255,200,80'; sfx.boom(); buzz([60, 40, 120]); }
  }
}

function shoot(u, tg, dmg, crit, big) {
  const sx = u.isBase ? u.x + u.side * 10 : u.x + u.side * u.r, sy = u.isBase ? -74 : -u.r * 2.2;
  const tx = tg.isBase ? tg.x - tg.side * BHW * 0.5 : tg.x - tg.side * tg.speed * 0.2 * (tg.moving ? 1 : 0), ty = tg.isBase ? -40 : -tg.r * 1.8;
  const T = clamp(Math.abs(tx - sx) / 420, 0.25, 0.9), g = 520;
  G.projs.push({ x: sx, y: sy, vx: (tx - sx) / T, vy: (ty - sy - 0.5 * g * T * T) / T, g, t: 0, T, tg, dmg, crit, side: u.side, big, kbF: big ? 40 : 12 });
  sfx.shoot();
}

function dmgOf(u) {
  let d = u.dmg, crit = false;
  if (u.side > 0) {
    if (G.cry > 0) d *= 1.5;
    if (Math.random() < critC(L('crit'))) { d *= 3; crit = true; }
  }
  return [d * rnd(0.9, 1.1), crit];
}

function endBattle(won) {
  if (G.phase !== 'fight') return;
  G.phase = won ? 'win' : 'lose';
  const b = won ? G.b2 : G.b1;
  b.hp = 0;
  G.slow = 1.6; G.shake = 26; G.flash = 0.5; G.flashC = won ? '255,210,120' : '255,60,40';
  for (let k = 0; k < 140; k++) part(b.x, -rnd(0, 90), rnd(-320, 320), rnd(-520, -80), rnd(0.6, 1.6), k % 3 ? '255,150,50' : '120,110,110', rnd(3, 7), 420);
  for (const u of G.units) if (!u.dead && u.side === b.side) kill(u, true);
  sfx.boom(); buzz([80, 40, 160]);
  let reward = 0;
  if (won) {
    reward = Math.round(30 * Math.pow(1.28, S.stage - 1) * lootM(L('loot')) * (G.boss ? 3 : 1));
    S.gold += reward; G.earned += reward; S.wins++;
    S.stage++; S.best = Math.max(S.best, S.stage);
  }
  save();
  setTimeout(() => showBanner(won, reward), 1300);
}

function showBanner(won, reward) {
  const bn = $('#banner');
  bn.className = 'banner ' + (won ? 'win' : 'lose');
  $('#bT').textContent = won ? 'VITÓRIA!' : 'DERROTA';
  $('#bP').textContent = won
    ? `A fortaleza inimiga caiu. ${G.kills} inimigos derrotados.`
    : `Sua fortaleza caiu, mas o ouro saqueado é seu. Fortaleça o exército e volte mais forte.`;
  $('#bL').innerHTML = `<span class="coin" style="display:inline-block;width:22px;height:22px;vertical-align:-3px;margin-right:6px"></span>+${fmt(G.earned)}`;
  const bb = $('#bB'); bb.innerHTML = '';
  const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.textContent = txt; b.addEventListener('click', () => { audioInit(); fn(); }); bb.appendChild(b); };
  mk('Forja', 'alt', () => openForge());
  mk(won ? `Batalha ${S.stage} ›` : 'Lutar de novo', '', () => { closeForge(); newBattle(); });
  bn.hidden = false;
  won ? sfx.win() : sfx.lose();
}

/* ================= Simulação ================= */
function step(dt) {
  G.t += dt;
  const fight = G.phase === 'fight';
  if (fight) {
    G.energy = Math.min(cap(L('cap')), G.energy + regen(L('regen')) * dt);
    G.cdTh = Math.max(0, G.cdTh - dt); G.cdCry = Math.max(0, G.cdCry - dt); G.cry = Math.max(0, G.cry - dt);
    G.streakT -= dt; if (G.streakT <= 0) G.streak = 0;
    // IA inimiga
    G.eT -= dt;
    if (G.eT <= 0) {
      const pool = FOES.filter(f => S.stage >= f.from);
      let tot = pool.reduce((a, f) => a + f.w, 0), r = Math.random() * tot, pick = pool[0];
      for (const f of pool) { r -= f.w; if (r <= 0) { pick = f; break; } }
      spawnE(pick, false);
      if (S.stage >= 3 && Math.random() < Math.min(0.45, S.stage * 0.03)) spawnE(FOES[0], false);
      G.eT = Math.max(1.0, 3.6 - S.stage * 0.07) * rnd(0.7, 1.3);
    }
    if (G.boss && !G.bossOut && G.t > 12) { G.bossOut = true; spawnE(BOSS, true); G.shake = 10; sfx.horn(); }
    // comando automático
    if (L('cmd')) {
      const c = cap(L('cap'));
      if (G.energy >= c * 0.95 || G.energy >= 150 + 40) {
        const opts = TROOPS.map((t, i) => i).filter(i => S.best >= TROOPS[i].unlock && G.energy >= TROOPS[i].cost);
        if (opts.length) trySpawn(opts[Math.random() < 0.6 ? opts.length - 1 : Math.floor(Math.random() * opts.length)]);
      }
    }
    if (L('strat')) {
      const foes = G.units.filter(u => !u.dead && u.side < 0);
      if (G.cdTh <= 0 && (foes.length >= 5 || foes.some(u => u.boss) || foes.some(u => u.x < WW * 0.3))) useThunder(true);
      const fighting = G.units.filter(u => !u.dead && u.side > 0 && !u.moving).length;
      if (G.cdCry <= 0 && fighting >= 3) useCry();
    }
    // torres
    G.tc1 -= dt; G.tc2 -= dt;
    if (G.tc1 <= 0) {
      const t = nearest(-1, B1X, 240);
      if (t) { shoot(G.b1, t, towerDmg(L('tower')), false, true); G.tc1 = 1.3; }
    }
    if (G.tc2 <= 0) {
      const t = nearest(1, B2X, 210);
      if (t) { shoot(G.b2, t, 5 * G.m, false, true); G.tc2 = 1.5; }
    }
  }
  const alive = G.units.filter(u => !u.dead);
  const spdM = G.cry > 0 ? 1.4 : 1;
  for (const u of alive) {
    u.flash = Math.max(0, u.flash - dt);
    u.atk = Math.max(0, u.atk - dt * 3.2);
    if (u.kb > 0) { u.x -= u.side * u.kb * dt; u.kb = Math.max(0, u.kb - (u.kb * 7 + 20) * dt); }
    u.x = clamp(u.x, B1X + BHW - 4, B2X - BHW + 4);
    if (!fight) { u.moving = false; continue; }
    let tg = null, td = 1e9;
    for (const e of alive) {
      if (e.side === u.side) continue;
      const d = (e.x - u.x) * u.side;
      if (d > -e.r && d < td) { td = d; tg = e; }
    }
    const reach = u.range + u.r;
    const eb = u.side > 0 ? G.b2 : G.b1;
    const bd = (eb.x - u.x) * u.side - BHW;
    let at = null;
    if (tg && td - tg.r <= reach) at = tg; else if (bd <= reach) at = eb;
    let blocked = !!at;
    if (!blocked) for (const f of alive) {
      if (f === u || f.side !== u.side) continue;
      const d = (f.x - u.x) * u.side;
      if (d > 0 && d < (u.r + f.r) * 0.8 + 2) { blocked = true; break; }
    }
    if (tg && !at && td - tg.r < u.r) blocked = true;
    u.moving = !blocked;
    const sm = u.side > 0 ? spdM : 1;
    if (!blocked) { u.x += u.side * u.speed * sm * dt; u.walk += dt * u.speed * 0.2 * sm; }
    u.cd -= dt * sm;
    if (at && u.cd <= 0) {
      u.cd = u.rate * rnd(0.92, 1.08); u.atk = 1;
      const [d, crit] = dmgOf(u);
      if (u.kind === 'ranged') shoot(u, at, d, crit, false);
      else {
        if (u.splash) {
          const cx = at.x;
          for (const e of alive) if (e.side !== u.side && !e.dead && Math.abs(e.x - cx) < u.splash) hurt(e, e === at ? d : d * 0.6, u, crit, u.kbF);
          if (Math.abs(eb.x - cx) < u.splash + BHW || at === eb) hurt(eb, d, u, crit);
          G.shake = Math.max(G.shake, u.boss ? 9 : 6); G.freeze = Math.max(G.freeze, 0.05);
          for (let k = 0; k < 10; k++) part(cx, -2, rnd(-160, 160), rnd(-200, -40), 0.6, '160,130,100', 4);
          sfx.heavy(); if (u.side > 0) buzz(25);
        } else {
          hurt(at, d, u, crit, u.kbF);
          crit ? sfx.crit() : sfx.hit();
        }
        if (crit) { G.shake = Math.max(G.shake, 5); G.freeze = Math.max(G.freeze, 0.045); buzz(15); }
      }
    }
  }
  // projéteis
  for (let i = G.projs.length - 1; i >= 0; i--) {
    const p = G.projs[i]; p.t += dt;
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t >= p.T) {
      G.projs.splice(i, 1);
      const tg = p.tg;
      if (tg && (tg.isBase || (!tg.dead && Math.abs(tg.x - p.x) < tg.r + 22))) {
        hurt(tg, p.dmg, null, p.crit, p.kbF);
        if (p.big) { for (let k = 0; k < 6; k++) part(p.x, p.y, rnd(-120, 120), rnd(-160, -20), 0.4, '255,170,80', 3); sfx.hit(); }
      } else {
        for (let k = 0; k < 3; k++) part(p.x, Math.min(p.y, -2), rnd(-40, 40), rnd(-80, -20), 0.3, '150,130,110', 2);
      }
    }
  }
  // mortos voando
  for (const u of G.units) if (u.dead) {
    u.dt += dt; u.vy += 700 * dt; u.x += u.vx * dt; u.y += u.vy * dt; u.rot += u.spin * dt;
    if (u.y > 0) { u.y = 0; u.vy *= -0.3; u.vx *= 0.6; u.spin *= 0.5; }
  }
  G.units = G.units.filter(u => !u.dead || u.dt < 1.3);
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.t += dt;
    if (p.t > p.life) { G.parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > 0) { p.y = 0; p.vy *= -0.35; p.vx *= 0.7; }
  }
  for (let i = G.floats.length - 1; i >= 0; i--) { const f = G.floats[i]; f.t += dt; if (f.t > 0.9) G.floats.splice(i, 1); }
  for (let i = G.bolts.length - 1; i >= 0; i--) { G.bolts[i].t += dt; if (G.bolts[i].t > 0.4) G.bolts.splice(i, 1); }
  G.b1.flash = Math.max(0, G.b1.flash - dt); G.b2.flash = Math.max(0, G.b2.flash - dt);
}
function nearest(side, x, range) {
  let best = null, bd = range;
  for (const u of G.units) if (!u.dead && u.side === side) { const d = Math.abs(u.x - x); if (d < bd) { bd = d; best = u; } }
  return best;
}

/* ================= Render ================= */
function wx(x) { return (x - G.cam) * SC; }
function drawBase(b) {
  const P = b.side > 0, x = wx(b.x), s = SC;
  ctx.save(); ctx.translate(x, GY); ctx.scale(s, s);
  if (!P) ctx.scale(-1, 1);
  const dead = b.hp <= 0;
  const stone = P ? '#5a4a48' : '#2f2838', stone2 = P ? '#6e5c58' : '#3c3349';
  ctx.fillStyle = stone;
  if (dead) { ctx.fillRect(-30, -22, 60, 22); ctx.fillStyle = stone2; ctx.fillRect(-20, -34, 18, 14); ctx.restore(); return; }
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-30, -70); ctx.lineTo(30, -70); ctx.lineTo(34, 0); ctx.fill();
  ctx.fillStyle = stone2;
  for (let k = 0; k < 4; k++) ctx.fillRect(-30 + k * 16, -80, 11, 12);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (let r = 0; r < 5; r++) for (let k = 0; k < 4; k++) ctx.fillRect(-28 + k * 15 + (r % 2) * 7, -64 + r * 12, 12, 1.5);
  ctx.fillStyle = '#1a0f0c'; ctx.beginPath(); ctx.roundRect(-10, -26, 20, 26, [10, 10, 0, 0]); ctx.fill();
  // torre
  ctx.fillStyle = stone; ctx.fillRect(-4, -100, 22, 22);
  ctx.fillStyle = P ? '#3b2b20' : '#20182a'; ctx.fillRect(4, -96, 16, 5);
  // bandeira
  ctx.strokeStyle = '#2a1d18'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-18, -80); ctx.lineTo(-18, -122); ctx.stroke();
  const wv = Math.sin(performance.now() / 200) * 3;
  ctx.fillStyle = P ? '#c62a20' : '#6d34b0';
  ctx.beginPath(); ctx.moveTo(-18, -122); ctx.quadraticCurveTo(-4, -118 + wv, 10, -116); ctx.lineTo(-18, -106); ctx.fill();
  if (!P) { ctx.fillStyle = 'rgba(160,90,255,.35)'; ctx.beginPath(); ctx.arc(-2, -40, 34 + Math.sin(performance.now() / 300) * 3, 0, TAU); ctx.fill(); }
  if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${b.flash * 4})`; ctx.fillRect(-34, -100, 68, 100); }
  ctx.restore();
}
function hpBar(x, y, w, h, frac, col) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * clamp(frac, 0, 1), h);
}
function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // câmera
  if (G.camHold > 0) G.camHold -= dt;
  else {
    let pf = B1X + 60, ef = B2X - 60;
    for (const u of G.units) if (!u.dead) { if (u.side > 0) pf = Math.max(pf, u.x); else ef = Math.min(ef, u.x); }
    const focus = Math.min(pf + 60, (pf + ef) / 2 + 30);
    const target = clamp(focus - VIEW * 0.55, -20, WW + 20 - VIEW);
    G.cam += (target - G.cam) * Math.min(1, dt * 2.5);
  }
  G.cam = clamp(G.cam, -20, Math.max(-20, WW + 20 - VIEW));
  const sh = G.shake; G.shake = Math.max(0, G.shake - dt * 40);
  const ox = sh ? rnd(-sh, sh) * 0.5 : 0, oy = sh ? rnd(-sh, sh) * 0.5 : 0;
  // céu
  const sky = ctx.createLinearGradient(0, 0, 0, GY);
  sky.addColorStop(0, '#1a0f1f'); sky.addColorStop(0.55, '#4a1a22'); sky.addColorStop(1, '#a8452a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // sol
  ctx.fillStyle = 'rgba(255,150,70,.5)'; ctx.beginPath(); ctx.arc(W * 0.7 - G.cam * SC * 0.05, GY - H * 0.18, H * 0.12, 0, TAU); ctx.fill();
  // montanhas
  const ml = [['#2a1420', 0.15, 0.42], ['#1d0f17', 0.35, 0.28]];
  ml.forEach(([col, par, hh], l) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GY);
    const step = 40 * SC;
    const off = G.cam * SC * par;
    for (let i = -1; i <= Math.ceil(W / step) + 1; i++) {
      const gi = Math.floor(off / step) + i;
      const v = MTN[l][((gi % 60) + 60) % 60];
      ctx.lineTo(i * step - (off % step), GY - H * hh * (0.35 + v * 0.5));
    }
    ctx.lineTo(W, GY); ctx.fill();
  });
  // brasas no ar
  for (const e of EMB) {
    e.y -= e.v * dt; e.x += Math.sin(performance.now() / 900 + e.ph) * 6 * dt;
    if (e.y < -5) { e.y = GY; e.x = Math.random() * W; }
    ctx.fillStyle = `rgba(255,${120 + e.ph * 20 | 0},50,${0.25 + 0.35 * Math.sin(performance.now() / 300 + e.ph * 3) ** 2})`;
    ctx.fillRect(e.x, e.y, e.s, e.s);
  }
  ctx.save(); ctx.translate(ox, oy);
  // chão
  ctx.fillStyle = '#2b1a14'; ctx.fillRect(-20, GY, W + 40, H - GY + 20);
  ctx.fillStyle = '#3d2519'; ctx.fillRect(-20, GY, W + 40, 4);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (let x = Math.floor(G.cam / 30) * 30; x < G.cam + VIEW + 30; x += 30) ctx.fillRect(wx(x + ((x * 7) % 13)), GY + 8 + ((x * 3) % 9), 8 * SC, 2);
  drawBase(G.b1); drawBase(G.b2);
  // unidades
  const us = G.units.slice().sort((a, b) => a.size - b.size);
  for (const u of us) {
    const x = wx(u.x);
    if (x < -60 || x > W + 60) continue;
    ctx.save(); ctx.translate(x, GY + (u.y || 0) * SC); ctx.scale(SC, SC);
    if (u.dead) { ctx.translate(0, -u.r * 1.5); ctx.rotate(u.rot); ctx.translate(0, u.r * 1.5); }
    if (u.side > 0 && G.cry > 0 && !u.dead) { ctx.fillStyle = 'rgba(255,120,40,.25)'; ctx.beginPath(); ctx.ellipse(0, -u.r * 1.8, u.r * 1.5, u.r * 2.4, 0, 0, TAU); ctx.fill(); }
    if (u.boss && !u.dead) { ctx.fillStyle = 'rgba(140,70,230,.22)'; ctx.beginPath(); ctx.arc(0, -u.r * 2, u.r * 2.6, 0, TAU); ctx.fill(); }
    drawWarrior(ctx, u.type, u.side, u.tier, u.walk, u.atk, u.flash, u.dead ? Math.max(0, 1 - u.dt / 1.3) : 1);
    ctx.restore();
    if (!u.dead && u.hp < u.max) hpBar(x, GY - u.r * 4.6 * SC, Math.max(16, u.r * 2.4 * SC), 3, u.hp / u.max, u.side > 0 ? '#e0453a' : '#a46cff');
  }
  // projéteis
  for (const p of G.projs) {
    const x = wx(p.x), y = GY + p.y * SC;
    if (p.big) { ctx.fillStyle = p.side > 0 ? '#ffb347' : '#b07cff'; ctx.beginPath(); ctx.arc(x, y, 3.5 * SC, 0, TAU); ctx.fill(); }
    else {
      const a = Math.atan2(p.vy, p.vx);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.strokeStyle = p.crit ? '#ff5a3c' : '#e8dcc8'; ctx.lineWidth = 1.6 * SC;
      ctx.beginPath(); ctx.moveTo(-7 * SC, 0); ctx.lineTo(6 * SC, 0); ctx.stroke(); ctx.restore();
    }
  }
  // partículas
  for (const p of G.parts) {
    const k = 1 - p.t / p.life;
    ctx.fillStyle = `rgba(${p.col},${k})`;
    const s = p.sz * SC * (0.5 + k * 0.5);
    ctx.fillRect(wx(p.x) - s / 2, GY + p.y * SC - s / 2, s, s);
  }
  // raios
  for (const b of G.bolts) {
    const k = 1 - b.t / 0.4, x = wx(b.x);
    ctx.strokeStyle = `rgba(200,225,255,${k})`; ctx.lineWidth = 3 + 4 * k; ctx.shadowColor = '#7fb6ff'; ctx.shadowBlur = 20;
    ctx.beginPath(); let y = 0, xx = x + rnd(-20, 20); ctx.moveTo(xx, y);
    while (y < GY) { y += rnd(12, 26); xx += rnd(-12, 12); ctx.lineTo(xx, Math.min(y, GY)); }
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  // textos
  ctx.textAlign = 'center';
  for (const f of G.floats) {
    const k = 1 - f.t / 0.9, pop = 1 + Math.max(0, 0.12 - f.t) * 4;
    ctx.font = `${Math.round(f.size * pop)}px "Black Ops One", Impact, sans-serif`;
    const x = wx(f.x), y = GY + f.y * SC - f.t * 50;
    ctx.lineWidth = 4; ctx.strokeStyle = `rgba(20,8,10,${k})`; ctx.strokeText(f.txt, x, y);
    ctx.fillStyle = `rgba(${f.col},${k})`; ctx.fillText(f.txt, x, y);
  }
  ctx.restore();
  // barras das fortalezas e minimapa
  const bw = Math.min(150, W * 0.36);
  ctx.font = '600 15px Teko, sans-serif'; ctx.textAlign = 'left';
  hpBar(10 + bw / 2, 12, bw, 7, G.b1.hp / G.b1.max, '#e0453a');
  hpBar(W - 10 - bw / 2, 12, bw, 7, G.b2.hp / G.b2.max, '#a46cff');
  ctx.fillStyle = '#f4e9df'; ctx.fillText(fmt(Math.max(0, G.b1.hp)), 10, 34);
  ctx.textAlign = 'right'; ctx.fillText((G.boss ? 'CHEFE · ' : '') + fmt(Math.max(0, G.b2.hp)), W - 10, 34);
  // minimapa
  const mw = Math.min(140, W - 2 * bw - 40), mx = W / 2 - mw / 2, my = 10;
  if (mw > 50) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(mx, my, mw, 10);
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(mx + (G.cam / WW) * mw, my - 1, (VIEW / WW) * mw, 12);
    for (const u of G.units) if (!u.dead) { ctx.fillStyle = u.side > 0 ? '#ff6a50' : '#b88aff'; ctx.fillRect(mx + (u.x / WW) * mw - 1, my + 3, u.size > 1.4 ? 3 : 2, 4); }
  }
  // combo
  if (G.streak >= 3 && G.phase === 'fight') {
    ctx.textAlign = 'center'; ctx.font = `${18 + Math.min(10, G.streak / 2)}px "Black Ops One", Impact, sans-serif`;
    ctx.fillStyle = `rgba(255,201,74,${Math.min(1, G.streakT)})`; ctx.strokeStyle = 'rgba(20,8,10,.8)'; ctx.lineWidth = 4;
    const t = `COMBO ×${G.streak}`; ctx.strokeText(t, W / 2, 56); ctx.fillText(t, W / 2, 56);
  }
  if (G.boss && G.bossOut && G.phase === 'fight' && G.t < 15) {
    ctx.textAlign = 'center'; ctx.font = '26px "Black Ops One", Impact, sans-serif';
    ctx.fillStyle = `rgba(190,140,255,${Math.min(1, 15 - G.t)})`; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 5;
    ctx.strokeText('O REI CINZENTO CHEGOU', W / 2, H * 0.4); ctx.fillText('O REI CINZENTO CHEGOU', W / 2, H * 0.4);
  }
  if (G.flash > 0) { ctx.fillStyle = `rgba(${G.flashC},${Math.min(0.7, G.flash)})`; ctx.fillRect(0, 0, W, H); G.flash = Math.max(0, G.flash - dt * 1.5); }
}

/* arrastar câmera */
let drag = null;
field.addEventListener('pointerdown', e => { if (e.target !== cv) return; drag = { x: e.clientX, cam: G.cam }; audioInit(); });
window.addEventListener('pointermove', e => { if (!drag) return; G.cam = drag.cam - (e.clientX - drag.x) / SC; G.camHold = 2.5; });
window.addEventListener('pointerup', () => { drag = null; });

/* ================= UI ================= */
const troopsEl = $('#troops');
const trBtns = TROOPS.map((t, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tr';
  b.innerHTML = `<span class="lv"></span><canvas width="104" height="104"></canvas><span class="nm">${t.n}</span><span class="cs"></span>`;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); trySpawn(i); });
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trySpawn(i); } });
  troopsEl.appendChild(b);
  return { b, c: b.querySelector('canvas'), lv: b.querySelector('.lv'), cs: b.querySelector('.cs'), drawnTier: -1 };
});
function paintIcons() {
  TROOPS.forEach((t, i) => {
    const r = trBtns[i], lv = L(t.id), tier = lv >= 35 ? 4 : lv >= 20 ? 3 : lv >= 10 ? 2 : lv >= 5 ? 1 : 0;
    if (r.drawnTier === tier) return; r.drawnTier = tier;
    const c = r.c.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 104, 104);
    const sz = TYPES[t.id].size;
    const k = 3.0 / Math.max(1, sz * 0.75);
    c.translate(52, 96); c.scale(k, k);
    drawWarrior(c, t.id, 1, tier, 0.6, 0, 0, 1);
  });
}
const setT = (el, v) => { if (el.textContent !== v) el.textContent = v; };
const tog = (el, c, on) => { if (el.classList.contains(c) !== on) el.classList.toggle(c, on); };
function updateHud() {
  setT($('#stg'), `Batalha ${S.stage}`);
  setT($('#best'), `Recorde: batalha ${S.best}`);
  setT($('#gold'), fmt(S.gold));
  if (!G) return;
  const cp = cap(L('cap'));
  $('#fury').style.width = (G.energy / cp * 100) + '%';
  setT($('#furyN'), `${Math.floor(G.energy)}/${cp}`);
  TROOPS.forEach((t, i) => {
    const r = trBtns[i], locked = S.best < t.unlock;
    tog(r.b, 'locked', locked);
    setT(r.cs, locked ? `Batalha ${t.unlock}` : String(t.cost));
    setT(r.lv, locked ? '' : 'Nv ' + (L(t.id) + 1));
    tog(r.b, 'ok', !locked && G.energy >= t.cost && G.phase === 'fight');
    r.b.style.setProperty('--p', locked ? 0 : Math.min(1, G.energy / t.cost));
  });
  const abT = $('#abT'), abC = $('#abC');
  abT.style.setProperty('--cd', G.cdTh / 28); abC.style.setProperty('--cd', G.cdCry / 32);
  tog(abT, 'ready', G.cdTh <= 0 && G.phase === 'fight'); tog(abC, 'ready', G.cdCry <= 0 && G.phase === 'fight');
  tog(abT, 'cool', G.cdTh > 0); tog(abC, 'cool', G.cdCry > 0);
  setT($('#abTt'), G.cdTh > 0 ? String(Math.ceil(G.cdTh)) : '');
  setT($('#abCt'), G.cdCry > 0 ? String(Math.ceil(G.cdCry)) : (G.cry > 0 ? '' : ''));
  const any = UPG.some(u => upVisible(u) && !upMaxed(u) && S.gold >= upCost(u));
  const fb = $('#abF'); let d = fb.querySelector('.dot');
  if (any && !d) { d = document.createElement('span'); d.className = 'dot'; fb.appendChild(d); } else if (!any && d) d.remove();
}
$('#abT').addEventListener('click', () => { audioInit(); useThunder(); });
$('#abC').addEventListener('click', () => { audioInit(); useCry(); });
$('#abF').addEventListener('click', () => { audioInit(); openForge(); });
$('#dx').addEventListener('click', closeForge);

let upRefs = [];
function openForge() {
  const ul = $('#ul'); ul.innerHTML = ''; upRefs = [];
  let lastG = '';
  for (const u of UPG) {
    if (!upVisible(u)) continue;
    if (u.g !== lastG) { lastG = u.g; const h = document.createElement('div'); h.className = 'gh'; h.textContent = u.g; ul.appendChild(h); }
    const el = document.createElement('div'); el.className = 'u';
    el.innerHTML = `<div style="min-width:0"><div class="n"></div><div class="d"></div></div><button type="button" class="buy"></button>`;
    el.querySelector('.buy').addEventListener('click', () => buyUp(u.id));
    ul.appendChild(el);
    upRefs.push({ u, el, n: el.querySelector('.n'), d: el.querySelector('.d'), b: el.querySelector('.buy'), k: '' });
  }
  $('#drawer').hidden = false;
  updForge(true);
}
function closeForge() { $('#drawer').hidden = true; }
function updForge() {
  if ($('#drawer').hidden) return;
  for (const r of upRefs) {
    const u = r.u, lv = L(u.id), mx = upMaxed(u), c = upCost(u);
    const key = lv + '|' + mx;
    if (r.k !== key) {
      r.k = key;
      r.n.innerHTML = u.n + (u.once ? '' : ` <b>Nv ${lv + (TROOPS.some(t => t.id === u.id) ? 1 : 0)}</b>`);
      r.d.innerHTML = mx && !u.once ? u.d(lv - 1).replace(/<em>.*?<\/em>/g, '') : u.d(lv);
      r.b.innerHTML = mx ? (u.once ? 'Ativo' : 'Máximo') : `<span class="coin"></span>${fmt(c)}`;
    }
    tog(r.el, 'maxed', !!mx);
    tog(r.el, 'can', !mx && S.gold >= c);
  }
}
function buyUp(id) {
  const u = UPI[id]; if (!u || upMaxed(u)) return;
  const c = upCost(u);
  if (S.gold < c) { sfx.no(); return; }
  S.gold -= c; S.lv[id] = L(id) + 1;
  if (id === 'wall' && G && G.phase === 'fight') { const add = baseHp(L('wall')) - G.b1.max; G.b1.max += add; G.b1.hp += add; }
  sfx.buy(); buzz(15);
  paintIcons(); save(); updForge(); updateHud();
}

/* ================= Loop ================= */
let last = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  let sim = dt;
  if (G.freeze > 0) { G.freeze -= dt; sim = 0; }
  if (G.slow > 0) { G.slow -= dt; sim *= 0.3; }
  if (sim > 0) step(sim);
  render(dt);
  uiT += dt; saveT += dt;
  if (uiT > 0.08) { uiT = 0; updateHud(); updForge(); }
  if (saveT > 8) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

function start(data) {
  load(data);
  paintIcons();
  newBattle();
  if (S.tut) trBtns[0].b.classList.add('hintp');
  last = performance.now();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
const hot = window.claude?.hot;
if (hot && hot.ready) hot.ready(start); else start(hot?.data ?? {});
})();
